server {
    listen 80;
    server_name ${PUBLIC_DOMAIN};

    location = /healthz {
        return 200 "OK\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_DOMAIN};

    # SSL Certs (Mapped from host)
    ssl_certificate /etc/letsencrypt/live/${PUBLIC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to AdGuard Home Web Interface (NetBird VPN and localhost only)
    location / {
        allow 100.64.0.0/10; # NetBird default CGNAT range (100.64.0.0 - 100.127.255.255)
        allow 10.0.0.0/8;    # NetBird custom private range
        allow 172.16.0.0/12; # NetBird custom private range
        allow 192.168.0.0/16;# Private network range
        allow 127.0.0.1;     # Host local
        deny all;            # Block all public internet access

        proxy_pass http://adguard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for DNS-over-HTTPS (DoH)
    location /dns-query {
        proxy_pass http://adguard:80/dns-query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
